# Render free web services spin down after ~15 minutes of inactivity and take
# 30-60s to boot again. The hourly data-sync workflow leaves a 45-minute cold
# window, so the first real visitor of the hour waits out a cold start.
#
# This pings both services often enough that they never sleep.
#
# NOTE: GitHub's scheduler is best-effort and can drift by several minutes under
# load. Before anything that must not stall — a demo, a review — hit the health
# URLs by hand and confirm they answer instantly.
name: Keep Services Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# A late run should not queue behind an earlier one.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    name: Ping health endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API and AI service
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          AI_SERVER_URL: ${{ secrets.AI_SERVER_URL }}
        run: |
          set -uo pipefail

          ping_service() {
            local name="$1" base="$2" path="$3"

            if [ -z "$base" ]; then
              echo "::notice::$name — no URL secret set, skipping"
              return 0
            fi

            base="$(printf '%s' "$base" | tr -d '[:space:]' | sed 's|/*$||')"
            local url="$base$path"
            local start elapsed code
            start=$(date +%s)

            # --max-time 90 covers a full cold start rather than failing during one.
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$url" || echo "000")
            elapsed=$(( $(date +%s) - start ))

            if [ "$code" = "200" ]; then
              echo "$name: 200 in ${elapsed}s"
              if [ "$elapsed" -gt 15 ]; then
                echo "::warning::$name took ${elapsed}s — it had gone cold."
              fi
            else
              # Never fail the job: a red X every 10 minutes trains everyone to
              # ignore CI. A warning is enough for a best-effort warmer.
              echo "::warning::$name returned $code after ${elapsed}s ($url)"
            fi
          }

          ping_service "API"        "$BACKEND_URL"   "/health"
          ping_service "AI service" "$AI_SERVER_URL" "/api/v1/health"
